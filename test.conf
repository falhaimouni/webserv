server {
    listen 8080;
    server_name localhost;

    root /home/ealshorm/webserver/www;
    index index.html;
    client_max_body_size 1M;

    error_page 501 /home/ealshorm/webserver/www/error/501.html;
    error_page 404 /home/ealshorm/webserver/www/error/404.html;
    error_page 500 /home/ealshorm/webserver/www/error/500.html;

    error_page 400 /home/ealshorm/webserver/www/error/400.html;
    error_page 401 /home/ealshorm/webserver/www/error/401.html;
    error_page 403 /home/ealshorm/webserver/www/error/403.html;
    error_page 405 /home/ealshorm/webserver/www/error/405.html;
    error_page 503 /home/ealshorm/webserver/www/error/503.html;
    error_page 502 /home/ealshorm/webserver/www/error/502.html;
    
    location / {
        root /home/ealshorm/webserver/www;
        index index.html;
        autoindex off;
    }

    location /cgi-bin/ {
        root /home/ealshorm/webserver/www;
        cgi_extension .sh /bin/bash;
        cgi_extension .py /usr/bin/python3;
        allowed_methods GET POST;
    }
}