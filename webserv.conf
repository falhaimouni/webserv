# ===============================
# Webserv Configuration for Farah
# ===============================

server {
    listen 172.17.0.1:8080;
    # host 172.22.196.134;

    server_name localhost;

    root ./www;
    index test.html;

    client_max_body_size 1M;

    # Default error pages
    error_page 404 ./www/etc/404.html;
    error_page 500 ./www/etc/500.html;

    # ----------------------------------
    # Root
    # ----------------------------------
    location / {
        methods GET POST DELETE;
        autoindex on;
    }

    # ----------------------------------
    # Directory listing test
    # ----------------------------------
    location /testdir {
        methods GET;
        root ./www/testdir;
        autoindex on;
    }

    # ----------------------------------
    # Upload route
    # ----------------------------------
    location /uploads {
        methods GET POST DELETE;
        upload_enable on;
        upload_store ./www/uploads;
    }

    # ----------------------------------
    # CGI - Python
    # ----------------------------------
    location /cgi-bin {
        methods GET POST;
        root ./www/cgi-bin;
        cgi_extension .py /usr/bin/python3;
        cgi_extension .sh /usr/bin/bash;
        autoindex on;
    }

    # Also allow direct execution of test.py at root
    location /test.py {
        methods GET POST;
        root ./www;
        cgi_extension .py;
        cgi_path /usr/bin/python3;
        autoindex off;
    }
}

